<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
    <title id="title">O desenho do gêmeo digital</title><desc id="desc">Identidade, propriedades, relações e tempo de atualização tornam o modelo utilizável.</desc>
    <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#0f766e"/></marker></defs>
    <style>text{font-family:Arial,sans-serif;fill:#172536} .title{font-size:30px;font-weight:700} .label{font-size:24px;font-weight:700} .body{font-size:21px} .small{font-size:18px;fill:#475569} .line{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#arrow)}</style>
    <rect width="1200" height="500" rx="18" fill="#f8fafc"/>
    <text x="36" y="47" class="title">O desenho do gêmeo digital</text><text x="36" y="79" class="small">Identidade, propriedades, relações e tempo de atualização tornam o modelo utilizável.</text><rect x="35" y="155" width="310" height="200" rx="12" fill="white" stroke="#8b1e3f" stroke-width="2"/><rect x="35" y="155" width="6" height="200" rx="3" fill="#8b1e3f"/><text x="57" y="192" class="label">Ônibus BUS-017</text><text x="57" y="231" class="body">velocidade: 24 km/h</text><text x="57" y="261" class="body">ocupação: 42 pessoas</text><text x="57" y="291" class="body">medido_em: 100 s</text><rect x="445" y="155" width="310" height="200" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><rect x="445" y="155" width="6" height="200" rx="3" fill="#0f766e"/><text x="467" y="192" class="label">Linha L-06</text><text x="467" y="231" class="body">percurso do ciclo: 12 km</text><text x="467" y="261" class="body">frota ativa: 8 ônibus</text><text x="467" y="291" class="body">demanda: 600 pess./h</text><rect x="855" y="155" width="310" height="200" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><rect x="855" y="155" width="6" height="200" rx="3" fill="#0f766e"/><text x="877" y="192" class="label">Parada P-03</text><text x="877" y="231" class="body">ordem na linha: 3</text><text x="877" y="261" class="body">fila estimada: 12</text><text x="877" y="291" class="body">observada_em: 95 s</text><path class="line" d="M346 240 H438"/><text x="350" y="212" class="small">opera em</text><path class="line" d="M756 240 H849"/><text x="765" y="212" class="small">atende</text><text x="36" y="420" class="body">Modelo = tipos e regras. Instância = um ônibus identificado e seu estado.</text><text x="36" y="457" class="small">Dados fictícios. Um grafo e uma tabela podem representar o gêmeo, mesmo sem uma cena 3D.</text></svg>