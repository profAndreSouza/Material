<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
    <title id="title">Uma arquitetura híbrida para a frota</title><desc id="desc">Particionamento por função e por dado, com caminho local independente da internet.</desc>
    <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#0f766e"/></marker></defs>
    <style>text{font-family:Arial,sans-serif;fill:#172536} .title{font-size:30px;font-weight:700} .label{font-size:24px;font-weight:700} .body{font-size:21px} .small{font-size:18px;fill:#475569} .line{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#arrow)}</style>
    <rect width="1200" height="500" rx="18" fill="#f8fafc"/>
    <text x="36" y="47" class="title">Uma arquitetura híbrida para a frota</text><text x="36" y="79" class="small">Particionamento por função e por dado, com caminho local independente da internet.</text><rect x="35" y="140" width="305" height="205" rx="12" fill="white" stroke="#8b1e3f" stroke-width="2"/><rect x="35" y="140" width="6" height="205" rx="3" fill="#8b1e3f"/><text x="57" y="177" class="label">Ônibus + borda</text><text x="57" y="216" class="body">Sensores e gateway</text><text x="57" y="246" class="body">Validação e alerta local</text><text x="57" y="276" class="body">Buffer de telemetria</text><rect x="447" y="140" width="305" height="205" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><rect x="447" y="140" width="6" height="205" rx="3" fill="#0f766e"/><text x="469" y="177" class="label">Ingestão na nuvem</text><text x="469" y="216" class="body">Autenticação e MQTT</text><text x="469" y="246" class="body">Validação de eventos</text><text x="469" y="276" class="body">Deduplicação e histórico</text><rect x="860" y="140" width="305" height="205" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><rect x="860" y="140" width="6" height="205" rx="3" fill="#0f766e"/><text x="882" y="177" class="label">Gêmeo + análise</text><text x="882" y="216" class="body">Estado por veículo</text><text x="882" y="246" class="body">Relações com a linha</text><text x="882" y="276" class="body">Cenários What-If</text><path class="line" d="M341 226 H441"/><text x="355" y="205" class="small">eventos</text><path class="line" d="M753 226 H854"/><text x="769" y="205" class="small">estado</text><path class="line" d="M1010 351 V420 H190 V351"/><text x="310" y="409" class="body">Configuração versionada, autorizada e com validade</text><text x="36" y="473" class="small">O controle veicular de segurança permanece em sistemas locais especializados.</text></svg>