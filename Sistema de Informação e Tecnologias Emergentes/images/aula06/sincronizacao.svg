<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
    <title id="title">Sincronização com qualidade explícita</title><desc id="desc">O horário da medição e o horário de recebimento respondem a perguntas diferentes.</desc>
    <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#0f766e"/></marker></defs>
    <style>text{font-family:Arial,sans-serif;fill:#172536} .title{font-size:30px;font-weight:700} .label{font-size:24px;font-weight:700} .body{font-size:21px} .small{font-size:18px;fill:#475569} .line{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#arrow)}</style>
    <rect width="1200" height="500" rx="18" fill="#f8fafc"/>
    <text x="36" y="47" class="title">Sincronização com qualidade explícita</text><text x="36" y="79" class="small">O horário da medição e o horário de recebimento respondem a perguntas diferentes.</text><rect x="35" y="135" width="310" height="175" rx="12" fill="white" stroke="#8b1e3f" stroke-width="2"/><rect x="35" y="135" width="6" height="175" rx="3" fill="#8b1e3f"/><text x="57" y="172" class="label">1. Medir</text><text x="57" y="211" class="body">event_id, entidade, seq</text><text x="57" y="241" class="body">t_evento e unidades</text><rect x="445" y="135" width="310" height="175" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><rect x="445" y="135" width="6" height="175" rx="3" fill="#0f766e"/><text x="467" y="172" class="label">2. Validar</text><text x="467" y="211" class="body">Origem e limites físicos</text><text x="467" y="241" class="body">Repetição e ordem</text><rect x="855" y="135" width="310" height="175" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><rect x="855" y="135" width="6" height="175" rx="3" fill="#0f766e"/><text x="877" y="172" class="label">3. Atualizar</text><text x="877" y="211" class="body">Somente evento mais novo</text><text x="877" y="241" class="body">Registrar t_recebimento</text><path class="line" d="M346 220 H438"/><path class="line" d="M756 220 H849"/><path class="line" d="M1010 315 V365 H190 V315"/><text x="320" y="355" class="small">Novo evento aceito renova a observação</text><text x="36" y="414" class="body">Idade do dado = agora − t_evento. Acima de 30 s: estado desatualizado.</text><text x="36" y="453" class="small">Hipótese didática: relógios sincronizados. A produção precisa tratar desvio de relógio e reinício do dispositivo.</text></svg>