<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
    <title id="title">O cenário usa uma cópia do estado</title><desc id="desc">A simulação oferece evidência para uma decisão humana, sem alterar a frota automaticamente.</desc>
    <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#0f766e"/></marker></defs>
    <style>text{font-family:Arial,sans-serif;fill:#172536} .title{font-size:30px;font-weight:700} .label{font-size:24px;font-weight:700} .body{font-size:21px} .small{font-size:18px;fill:#475569} .line{fill:none;stroke:#0f766e;stroke-width:3;marker-end:url(#arrow)}</style>
    <rect width="1200" height="500" rx="18" fill="#f8fafc"/>
    <text x="36" y="47" class="title">O cenário usa uma cópia do estado</text><text x="36" y="79" class="small">A simulação oferece evidência para uma decisão humana, sem alterar a frota automaticamente.</text><rect x="35" y="145" width="305" height="190" rx="12" fill="white" stroke="#8b1e3f" stroke-width="2"/><rect x="35" y="145" width="6" height="190" rx="3" fill="#8b1e3f"/><text x="57" y="182" class="label">Estado observado</text><text x="57" y="221" class="body">Telemetria aceita</text><text x="57" y="251" class="body">Qualidade e idade</text><text x="57" y="281" class="body">Velocidade por veículo</text><rect x="447" y="145" width="305" height="190" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><rect x="447" y="145" width="6" height="190" rx="3" fill="#0f766e"/><text x="469" y="182" class="label">Cópia + hipótese</text><text x="469" y="221" class="body">Velocidade do ciclo</text><text x="469" y="251" class="body">Demanda e frota</text><text x="469" y="281" class="body">Modelo simplificado</text><rect x="860" y="145" width="305" height="190" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><rect x="860" y="145" width="6" height="190" rx="3" fill="#0f766e"/><text x="882" y="182" class="label">Comparação</text><text x="882" y="221" class="body">Intervalo entre ônibus</text><text x="882" y="251" class="body">Capacidade por hora</text><text x="882" y="281" class="body">Espera e limitações</text><path class="line" d="M341 235 H441"/><path class="line" d="M753 235 H854"/><text x="36" y="405" class="body">Observação ≠ previsão. Resultado do modelo ≠ garantia de operação.</text><text x="36" y="451" class="small">Antes de aplicar: validar com histórico, medir erro e obter autorização operacional.</text></svg>