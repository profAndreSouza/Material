services:
  factoryhub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factoryhub_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - DATABASE_URL=sqlite:////app/data/factoryhub.db
    volumes:
      - ./data:/app/data
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: factoryhub_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log:
