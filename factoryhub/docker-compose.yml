services:
  factoryhub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factoryhub_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MQTT_BROKER_HOST=broker.hivemq.com
      - MQTT_BROKER_PORT=1883
      - DATABASE_URL=sqlite:////app/data/factoryhub.db
    volumes:
      - ./data:/app/data
